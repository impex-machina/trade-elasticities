name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testthat:
    runs-on: ubuntu-latest
    env:
      # renv restores into the project library; GitHub Actions has no
      # interactive prompts.
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R 4.6.0
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libglpk-dev libgit2-dev
        shell: bash

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      - name: Show session info
        run: |
          Rscript -e 'sessionInfo()'
          Rscript -e 'cat("data.table:", as.character(packageVersion("data.table")), "\n"); cat("Rcpp:", as.character(packageVersion("Rcpp")), "\n")'
        shell: bash

      - name: Run testthat suite
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
        shell: bash

      - name: Verify README.md matches its build inputs
        # The README-as-build-artifact lock: README.md must be exactly what
        # scripts/build_readme.R generates from README.template.md and the
        # committed results/*.json. Same mechanism as the optional local
        # pre-commit hook (scripts/hooks/pre-commit): build to a temp file
        # via README_BUILD_OUTPUT, compare content with line endings
        # normalized. This step is the enforced gate; the hook is a
        # convenience that catches drift before it reaches CI.
        run: |
          TMP="$(mktemp)"
          README_BUILD_OUTPUT="$TMP" Rscript scripts/build_readme.R
          if ! diff -u <(tr -d '\r' < "$TMP") <(tr -d '\r' < README.md); then
            echo "::error::README.md is out of sync with README.template.md + results/*.json."
            echo "::error::Regenerate with: Rscript scripts/build_readme.R  (then commit README.md)"
            exit 1
          fi
          echo "README.md is in sync with its build inputs."
        shell: bash
